<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>การ์ดส่งใจ</title>
<style>
  :root{
    --sky-deep:#1c3a5e;
    --fur-blue:#5b8bd6;
    --fur-light:#9fc3f0;
    --belly:#e9f2ff;
    --nose:#1a1a22;
    --coral:#ff6f6f;
    --coral-dark:#e2504f;
    --cream:#fff8ee;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:radial-gradient(circle at 50% 20%, var(--fur-blue) 0%, var(--sky-deep) 75%);
    font-family:'Trebuchet MS', 'Kanit', sans-serif;
    overflow-x:hidden;
  }
  .stage{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 16px 48px;
    position:relative;
  }
  /* floating stars */
  .stars span{
    position:absolute;background:#fff;border-radius:50%;opacity:.7;
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:.9;}}

  .card{
    position:relative;
    width:min(360px,90vw);
    background:var(--cream);
    border-radius:28px;
    padding:28px 22px 24px;
    box-shadow:0 25px 60px rgba(0,0,10,.45), 0 0 0 6px rgba(255,255,255,.08) inset;
    text-align:center;
    animation:cardIn .8s cubic-bezier(.2,.9,.25,1) both;
  }
  @keyframes cardIn{
    from{opacity:0; transform:translateY(40px) scale(.92);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  .critter-wrap{
    width:150px;height:150px;margin:0 auto 6px;
    position:relative;
    animation:bob 3.4s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-8px) rotate(1deg);}}

  svg{display:block;width:100%;height:100%;}

  .ear{transform-origin:center;}
  .ear-l{animation:earWiggleL 2.6s ease-in-out infinite;}
  .ear-r{animation:earWiggleR 2.6s ease-in-out infinite;}
  @keyframes earWiggleL{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-6deg);}}
  @keyframes earWiggleR{0%,100%{transform:rotate(0deg);}50%{transform:rotate(6deg);}}

  .blink{transform-origin:center; animation:blink 4.2s ease-in-out infinite;}
  @keyframes blink{
    0%,92%,100%{transform:scaleY(1);}
    95%{transform:scaleY(.1);}
  }

  .paws{transform-origin: center bottom; animation:pawHug 2s ease-in-out infinite;}
  @keyframes pawHug{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}

  .heart-burst{
    position:absolute; inset:0; pointer-events:none;
  }
  .fly-heart{
    position:absolute;
    font-size:20px;
    opacity:0;
    animation:flyUp 2.8s ease-in forwards;
  }
  @keyframes flyUp{
    0%{opacity:0; transform:translateY(0) scale(.5) rotate(0deg);}
    15%{opacity:1;}
    100%{opacity:0; transform:translateY(-140px) scale(1.1) rotate(20deg);}
  }

  .msg-title{
    color:var(--coral-dark);
    font-weight:800;
    font-size:15px;
    letter-spacing:.5px;
    margin:10px 0 2px;
  }

  textarea{
    width:100%;
    margin-top:8px;
    min-height:96px;
    border-radius:16px;
    border:2px solid #ffd7d3;
    background:#fff;
    padding:14px 14px;
    font-size:16px;
    line-height:1.5;
    color:#3a2a2a;
    resize:vertical;
    font-family:inherit;
    outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  textarea:focus{
    border-color:var(--coral);
    box-shadow:0 0 0 4px rgba(255,111,111,.15);
  }
  textarea::placeholder{color:#c9a9a5;}

  .from-row{
    display:flex; align-items:center; gap:8px;
    margin-top:12px; justify-content:center;
  }
  .from-row label{font-size:13px;color:#8a6f6c;font-weight:600;}
  .from-row input{
    border:2px solid #ffd7d3;
    border-radius:10px;
    padding:6px 10px;
    font-size:14px;
    font-family:inherit;
    outline:none;
    color:#3a2a2a;
    width:130px;
    text-align:center;
  }
  .from-row input:focus{border-color:var(--coral);}

  .send-btn{
    margin-top:16px;
    border:none;
    background:linear-gradient(135deg,var(--coral),var(--coral-dark));
    color:#fff;
    font-weight:800;
    font-size:15px;
    padding:12px 28px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(226,80,79,.4);
    transition:transform .15s ease;
  }
  .send-btn:active{transform:scale(.95);}

  .sig{
    margin-top:14px;
    font-size:12px;
    color:#bba39f;
    letter-spacing:.5px;
  }

  .footer-hint{
    margin-top:22px;
    color:#dbe8ff;
    font-size:12px;
    opacity:.7;
    text-align:center;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="stars" id="stars"></div>

  <div class="card">
    <div class="critter-wrap" id="critterWrap">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="furGrad" cx="35%" cy="30%" r="80%">
            <stop offset="0%" stop-color="#a9caf5"/>
            <stop offset="60%" stop-color="#5b8bd6"/>
            <stop offset="100%" stop-color="#3d6bb3"/>
          </radialGradient>
        </defs>

        <!-- ears -->
        <ellipse class="ear ear-l" cx="42" cy="52" rx="20" ry="30" fill="url(#furGrad)" transform="rotate(-25 42 52)"/>
        <ellipse class="ear ear-r" cx="158" cy="52" rx="20" ry="30" fill="url(#furGrad)" transform="rotate(25 158 52)"/>

        <!-- head -->
        <ellipse cx="100" cy="110" rx="72" ry="66" fill="url(#furGrad)"/>

        <!-- belly patch -->
        <ellipse cx="100" cy="150" rx="34" ry="20" fill="var(--belly)" opacity="0.85"/>

        <!-- eyes -->
        <g class="blink">
          <ellipse cx="72" cy="100" rx="15" ry="18" fill="var(--nose)"/>
          <circle cx="77" cy="93" r="4.5" fill="#fff"/>
        </g>
        <g class="blink">
          <ellipse cx="128" cy="100" rx="15" ry="18" fill="var(--nose)"/>
          <circle cx="133" cy="93" r="4.5" fill="#fff"/>
        </g>

        <!-- nose -->
        <ellipse cx="100" cy="128" rx="13" ry="9" fill="var(--nose)"/>

        <!-- smile -->
        <path d="M70 140 Q100 168 130 140" stroke="var(--nose)" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M78 148 Q100 156 122 148" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>

        <!-- cheeks -->
        <circle cx="60" cy="125" r="8" fill="#ff9d9d" opacity="0.5"/>
        <circle cx="140" cy="125" r="8" fill="#ff9d9d" opacity="0.5"/>

        <!-- paws holding a heart -->
        <g class="paws">
          <ellipse cx="80" cy="178" rx="14" ry="10" fill="var(--fur-light)"/>
          <ellipse cx="120" cy="178" rx="14" ry="10" fill="var(--fur-light)"/>
          <path d="M100 165 C92 155 76 158 76 172 C76 185 100 198 100 198 C100 198 124 185 124 172 C124 158 108 155 100 165 Z" fill="var(--coral)"/>
        </g>
      </svg>

      <div class="heart-burst" id="heartBurst"></div>
    </div>

    <div class="msg-title">💌 ส่งความรู้สึกดีๆ ให้กัน</div>

    <textarea id="msgBox" placeholder="พิมพ์ข้อความที่อยากบอกตรงนี้เลย..."></textarea>

    <div class="from-row">
      <label>จาก</label>
      <input id="fromBox" type="text" placeholder="ชื่อของคุณ">
    </div>

    <button class="send-btn" id="sendBtn">ส่งหัวใจ 💙</button>

    <div class="sig">แตะปุ่มเพื่อดูแอนิเมชั่นหัวใจ</div>
  </div>

  <div class="footer-hint">ปรับแก้ข้อความได้ตลอดเวลา ✨</div>
</div>

<script>
  // stars background
  const starsEl = document.getElementById('stars');
  for(let i=0;i<28;i++){
    const s = document.createElement('span');
    const size = Math.random()*2.5+1;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*60+'%';
    s.style.animationDelay = (Math.random()*3)+'s';
    starsEl.appendChild(s);
  }

  const burst = document.getElementById('heartBurst');
  const sendBtn = document.getElementById('sendBtn');
  const emojis = ['💙','💕','✨','⭐'];

  sendBtn.addEventListener('click', () => {
    for(let i=0;i<10;i++){
      const h = document.createElement('div');
      h.className = 'fly-heart';
      h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      h.style.left = (30 + Math.random()*90) + 'px';
      h.style.bottom = (10 + Math.random()*20) + 'px';
      h.style.animationDelay = (Math.random()*0.4) + 's';
      burst.appendChild(h);
      setTimeout(()=>h.remove(), 3200);
    }
    sendBtn.textContent = 'ส่งแล้ว! 💙';
    setTimeout(()=>{ sendBtn.textContent = 'ส่งหัวใจ 💙'; }, 1600);
  });
</script>

</body>
</html>
